spring.application.name=catalogo-ecommerce
server.port=8081

# Firestore (emulador local). FIRESTORE_EMULATOR_HOST tem prioridade quando definida.
firestore.project-id=demo-catalogo
firestore.emulator-host=${FIRESTORE_EMULATOR_HOST:localhost:8080}

#Configurações email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
